name: E2E Tests — Cypress

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        spec:
          - cypress/e2e/smoke/**/*.cy.js
          - cypress/e2e/auth/**/*.cy.js
          - cypress/e2e/public/**/*.cy.js
          - cypress/e2e/listings/**/*.cy.js
          - cypress/e2e/user/**/*.cy.js
          - cypress/e2e/modules/**/*.cy.js
          - cypress/e2e/admin/**/*.cy.js

    name: E2E — ${{ matrix.spec }} (${{ matrix.browser }})

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swapin_test
          MYSQL_USER: swapin_test
          MYSQL_PASSWORD: swapin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, gd, curl, intl, dom, zip
          tools: composer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          fi

      - name: Copy environment for CI
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          cat >> .env <<'EOF'
          SWAPIN_APP_URL=http://localhost:8080
          SWAPIN_DB_HOST=127.0.0.1
          SWAPIN_DB_NAME=swapin_test
          SWAPIN_DB_USER=swapin_test
          SWAPIN_DB_PASS=swapin_test
          SWAPIN_ADMIN_EMAIL=admin@swaapin.ir
          SWAPIN_ENV=testing
          EOF

      - name: Run migrations & seed test data
        run: |
          if [ -f migrate.php ]; then
            php migrate.php || true
          fi
          if [ -f seed/seed_demo.php ]; then
            php seed/seed_demo.php || true
          fi

      - name: Start PHP built-in server (background)
        run: |
          php -S localhost:8080 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          sleep 3
          echo "PHP Server PID: $(cat /tmp/php-server.pid)"
          curl -sS http://localhost:8080/ | head -20 || true

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          spec: ${{ matrix.spec }}
          config: baseUrl=http://localhost:8080
          record: false
          wait-on: 'http://localhost:8080/'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:8080
          CYPRESS_testUserPhone: '09999999999'
          CYPRESS_testAdminEmail: 'admin@swaapin.ir'
          CYPRESS_testAdminPassword: 'Admin@123456'
          CYPRESS_testOTPCode: '123456'

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots/**
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ strategy.job-index }}
          path: cypress/videos/**
          if-no-files-found: ignore

      - name: Upload PHP server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log-${{ strategy.job-index }}
          path: /tmp/php-server.log
          if-no-files-found: ignore

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill $(cat /tmp/php-server.pid) || true
          fi

  e2e-all-browser:
    runs-on: ubuntu-latest
    name: E2E Full Suite (All Browsers)
    needs: e2e-tests
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci || npm install
      - name: All Specs — Summary
        run: echo "Full E2E suite triggered successfully"
