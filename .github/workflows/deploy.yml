name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/swapin"
            NGINX_SOURCE="$APP_DIR/ops/nginx/swaapin.ir.conf"
            NGINX_TARGET="/etc/nginx/sites-available/swaapin.ir"

            echo "========================================"
            echo "SWAAPIN PRODUCTION DEPLOY"
            echo "========================================"

            cd "$APP_DIR"

            echo "[1/8] Fetching main..."
            git fetch origin

            echo "[2/8] Syncing production with origin/main..."
            git reset --hard origin/main

            echo "[3/8] Installing dependencies..."
            if [ -f composer.json ]; then
              /usr/bin/composer install \
                --no-dev \
                --no-interaction \
                --prefer-dist \
                --optimize-autoloader
            fi

            echo "[4/8] Restoring runtime permissions..."
            if [ -d storage ]; then
              find storage -type d -exec chmod 775 {} +
              find storage -type f -exec chmod 664 {} +
            fi

            if [ -d uploads ]; then
              sudo find uploads -type d -exec chmod 775 {} +
              sudo find uploads -type f -exec chmod 664 {} +
            fi

            echo "[5/8] Installing version-controlled Nginx config..."

            if [ ! -f "$NGINX_SOURCE" ]; then
              echo "ERROR: Nginx source config not found:"
              echo "$NGINX_SOURCE"
              exit 1
            fi

            sudo cp "$NGINX_SOURCE" "$NGINX_TARGET"

            echo "[6/8] Validating Nginx..."
            sudo nginx -t

            echo "[7/8] Reloading services..."
            sudo systemctl reload php8.4-fpm
            sudo systemctl reload nginx

            echo "[8/8] Running production SEO guard..."

            if [ ! -x "$APP_DIR/tools/seo-production-check.sh" ]; then
              echo "ERROR: SEO production guard is missing or not executable."
              exit 1
            fi

            "$APP_DIR/tools/seo-production-check.sh"

            echo
            echo "========================================"
            echo "DEPLOY COMPLETED SUCCESSFULLY"
            echo "SEO PRODUCTION GUARD PASSED"
            echo "========================================"
