
name: Deploy Staging to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT }}

        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_FILE="$HOME/.ssh/staging_key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USERNAME@$HOST" 'bash -se' <<'REMOTE'

          set -Eeuo pipefail

          APP_DIR="/var/www/swapin-staging"

          echo "========================================"
          echo "SWAAPIN STAGING DEPLOY"
          echo "========================================"

          echo "[1/4] Fetching staging..."
          sudo -n -H git -c safe.directory="$APP_DIR" -C "$APP_DIR" fetch origin staging

          echo "[2/4] Syncing staging..."
          sudo -n -H git -c safe.directory="$APP_DIR" -C "$APP_DIR" reset --hard origin/staging

          echo "[3/5] Installing staging-only robots policy..."
          sudo install -o deploy -g www-data -m 644 \
            "$APP_DIR/ops/robots-staging.txt" "$APP_DIR/robots.txt"
          if ! grep -Fxq "Disallow: /" "$APP_DIR/robots.txt"; then
            echo "ERROR: Staging robots.txt does not block crawling."
            exit 1
          fi

          echo "[4/5] Restoring ownership..."
          sudo chown -R deploy:www-data "$APP_DIR"

          echo "[5/5] Installing dependencies..."
          cd "$APP_DIR"

          if [ -f composer.json ]; then
            sudo -u deploy -H /usr/bin/composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader
          fi

          echo "========================================"
          echo "STAGING DEPLOY SUCCESSFUL"
          echo "========================================"

          REMOTE

          rm -f "$KEY_FILE"
