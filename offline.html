<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سواَپین — اینترنت قطع شده</title>
<link rel="icon" type="image/x-icon" href="/src/img/fav_icon/favicon.ico">
<link rel="stylesheet" href="/src/css/fonts.css">
<link rel="stylesheet" href="/src/css/main.css">
<style>
  body{margin:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-fa);}
  .offline{max-width:480px;background:#fff;padding:48px 32px;border-radius:20px;box-shadow:0 20px 60px rgba(15,23,42,.08);text-align:center;}
  .offline__icon{font-size:4.5rem;color:#0a2540;margin-bottom:16px;}
  .offline__title{font-size:1.5rem;font-weight:800;color:#0f172a;margin:0 0 8px;}
  .offline__desc{color:#475569;margin:0 0 24px;font-size:.95rem;line-height:1.8;}
  .offline__btn{display:inline-block;padding:11px 24px;background:var(--accent,#0a2540);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<div class="offline">
  <div class="offline__icon">📡</div>
  <h1 class="offline__title">اینترنت شما وصل نیست!</h1>
  <p class="offline__desc">اتصال اینترنت رو چک کن و دوباره تلاش کن. در ضمن صفحه رو می‌تونیم <a href="/" class="offline__btn">برگشت به خانه</a></p>
</div>
</body>
</html>
