# ============================================================
# HTTP → HTTPS
# ============================================================

map $http_upgrade $swaapin_metabase_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;

    server_name swaapin.ir www.swaapin.ir;

    return 301 https://swaapin.ir$request_uri;
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name swaapin.ir www.swaapin.ir;

    root /var/www/swapin;
    index index.php index.html;

    client_max_body_size 128M;

    ssl_certificate     /etc/letsencrypt/live/swaapin.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swaapin.ir/privkey.pem;

    access_log /var/log/nginx/swaapin.access.log;
    error_log  /var/log/nginx/swaapin.error.log;

    # Private analytics UI. The URI on proxy_pass strips /meta/base/ upstream.
    location = /meta/base {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 308 https://swaapin.ir/meta/base/;
    }

    location ^~ /meta/base/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /meta/base;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $swaapin_metabase_connection;
        proxy_cookie_path / /meta/base/;
        proxy_redirect default;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }




# SEO canonical redirects


location = /auth/login {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/auth/login.php;
    fastcgi_param SCRIPT_NAME /auth/login.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}





location = /sitemap-main.xml {
    return 301 https://swaapin.ir/sitemap.xml;
}



# Canonical PHP URLs - direct requests only
if ($request_uri ~ ^/auth/login\.php$) {
    return 301 /auth/login;
}

if ($request_uri ~ ^/trades\.php$) {
    return 301 /trades;
}

if ($request_uri ~ ^/wallet\.php$) {
    return 301 /wallet;
}

if ($request_uri ~ ^/profile/edit\.php$) {
    return 301 /profile/edit;
}

if ($request_uri ~ ^/listings/create\.php$) {
    return 301 /listings/create;
}

    # ========================================================
    # Canonical host
    # ========================================================

    if ($host = www.swaapin.ir) {
        return 301 https://swaapin.ir$request_uri;
    }



    # ========================================================
    # Legacy WordPress dated URLs -> current postname URLs
    # SEO migration safeguard
    # ========================================================

    location ~ "^/blog/[0-9]{4}/[0-9]{2}/[0-9]{2}/(.+?)/?$" {
        return 301 https://swaapin.ir/blog/$1/;
    }

    # ========================================================
    # CMS Pages
    # ========================================================

    location /page/ {
        try_files $uri $uri/ @cms_page;
    }

    location @cms_page {
        rewrite ^/page/(.*)$ /page/index.php?slug=$1 last;
    }


    # ========================================================
    # Sensitive files
    # ========================================================

    location ~* \.(sql|zip|bak|backup|dump|env|log|ini|yml|yaml|md)$ {
        deny all;
    }

    location ~* ^/(run_.*\.php|migration_.*\.php|test.*\.php|env-test\.php)$ {
        # صفحات تستی/اسکریپتی طبق معماری سئو → 410 Gone
        return 410;
    }

    location ~* ^/(database|includes|storage|seed|tools|vendor|logs|backups|sql)/ {
        deny all;
    }


    # ========================================================
    # Special routes
    # ========================================================

    # دانلود اپلیکیشن — آدرس کانونیکال /app (طبق معماری سئو)
    location = /app {
        rewrite ^ /download.php last;
    }

    location = /app/ {
        rewrite ^ /download.php last;
    }

    location = /download {
        return 301 https://swaapin.ir/app;
    }

    location = /download/ {
        return 301 https://swaapin.ir/app;
    }

    # /exchange طبق سند به صفحه اصلی منتقل شده است
    location = /exchange {
        return 301 https://swaapin.ir/;
    }

    location = /exchange/ {
        return 301 https://swaapin.ir/;
    }

    location = /exchange.php {
        return 301 https://swaapin.ir/;
    }

    location = /trades {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/trades.php;
        fastcgi_param SCRIPT_NAME /trades.php;
        fastcgi_param QUERY_STRING $args;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /trades/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/trades.php;
        fastcgi_param SCRIPT_NAME /trades.php;
        fastcgi_param QUERY_STRING $args;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /profile {
        rewrite ^ /profile.php last;
    }

    location = /profile/ {
        rewrite ^ /profile.php last;
    }

    location = /sep/callback {
        try_files $uri /payment_callback.php$is_args$args;
    }


    # ========================================================
    # Category
    # ========================================================

    # 301 Redirect old /category/* URLs → new URLs without /category
    location ~ ^/category/(.+)$ {
        try_files $uri /category/index.php?redirect_slugs=$1;
    }

    # Legacy malformed /{APP_URL}/category/<slug> URLs (an old broken template
    # rendered "{APP_URL}" literally). Route to the canonical category resolver,
    # which issues a 301 to the real category URL.
    # NOTE: nginx matches the %-decoded URI, so the literal-brace form is used
    # (the %7B form is kept as a fallback in case decoding differs).
    location ~ "^/(?:\{APP_URL\}|%7BAPP_URL%7D)/category/(.+?)/?$" {
        rewrite ^ /category/index.php?redirect_slugs=$1 last;
    }

    location = /category/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # New hierarchical category URLs (without /category prefix)
    # Checked BEFORE @extensionless so categories win over PHP files.
    # Must exclude known system prefixes/dirs/files.
    location @category_route {
        rewrite ^/(.+)$ /category/index.php?slug_path=$1 last;
    }

    # Use a named location with conditional logic in @extensionless alternative:
    # We'll insert category check BEFORE the generic PHP rewrite. The approach:
    #  - Intercept @extensionless, detect non-system paths, proxy to category


    # ========================================================
    # SEO canonical PHP URLs
    # ========================================================

    if ($request_uri ~ ^/about\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/about;
    }

    if ($request_uri ~ ^/contact\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/contact;
    }

    if ($request_uri ~ ^/terms\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/terms;
    }

    if ($request_uri ~ ^/privacy\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/privacy;
    }


    # ========================================================
    # Listings canonical URLs
    # ========================================================

    # صفحه اصلی آگهی‌ها: /listings → صفحه کانونیکال کشور /iran
    location = /listings {
        return 301 https://swaapin.ir/iran;
    }

    location = /listings/ {
        return 301 https://swaapin.ir/iran;
    }

    location = /listings.php {
        return 301 https://swaapin.ir/iran;
    }

    location = /listings/all {
        return 301 https://swaapin.ir/iran;
    }

    location = /listings/all.php {
        return 301 https://swaapin.ir/iran;
    }

    # ── نقشه ریدایرکت مهاجرت (سند معماری سئو — بخش ۱۱) ────────────────
    # آدرس‌های قدیمی دسته‌ها → ساختار جدید کانونیکال /{location}/{category}
    # (بدون پیشوند /s/ طبق تصمیم پروژه). پارامترهای بی‌ارزش حذف می‌شوند.
    location = /real-estate {
        if ($arg_city = karaj) { return 301 https://swaapin.ir/karaj/real-estate?; }
        return 301 https://swaapin.ir/iran/real-estate?;
    }

    location = /real-estate/ {
        if ($arg_city = karaj) { return 301 https://swaapin.ir/karaj/real-estate?; }
        return 301 https://swaapin.ir/iran/real-estate?;
    }

    location = /vehicles/cars/passenger-cars {
        return 301 https://swaapin.ir/iran/passenger-cars?;
    }

    location = /vehicles/cars/passenger-cars/ {
        return 301 https://swaapin.ir/iran/passenger-cars?;
    }

    location = /electronics/mobile-tablet/mobile-phones {
        return 301 https://swaapin.ir/iran/mobile-phones?;
    }

    location = /electronics/mobile-tablet/mobile-phones/ {
        return 301 https://swaapin.ir/iran/mobile-phones?;
    }

    # صفحه نقشه مستقل طبق معماری سئو حذف شد → 410 Gone
    location = /listings/map {
        return 410;
    }

    location = /listings/map/ {
        return 410;
    }

    location = /listings/map_view.php {
        return 410;
    }


    # ========================================================
    # Store
    # ========================================================

    location = /store {
        rewrite ^ /store/index.php last;
    }

    location = /store/ {
        rewrite ^ /store/index.php last;
    }

    location = /store/request {
        rewrite ^ /store/request.php last;
    }

    location = /shops {
        if ($arg_type = online)  { return 301 /shops/online; }
        if ($arg_type = physical){ return 301 /shops/physical; }
        rewrite ^ /shops/index.php last;
    }
    location = /shops/ {
        if ($arg_type = online)  { return 301 /shops/online; }
        if ($arg_type = physical){ return 301 /shops/physical; }
        rewrite ^ /shops/index.php last;
    }
    location = /shops/online {
        rewrite ^ /shops/index.php?type=online last;
    }
    location = /shops/online/ {
        rewrite ^ /shops/index.php?type=online last;
    }
    location = /shops/physical {
        rewrite ^ /shops/index.php?type=physical last;
    }
    location = /shops/physical/ {
        rewrite ^ /shops/index.php?type=physical last;
    }


    # ========================================================
    # SHOP
    # ========================================================
    #
    # IMPORTANT:
    # /shop/index.php has an exact location below.
    # This is required because ^~ /shop/ otherwise prevents
    # the generic PHP location from handling shop PHP files.
    #

    location ^~ /shop/ {
        try_files $uri $uri/ @shop_page;
    }

    location @shop_page {
        # 301: آدرس‌های قدیمی /shop/<type>/<slug> → آدرس کانونیکال /shop/<slug>
        rewrite ^/shop/(online|physical|both)/(.+?)/?$ /shop/$2 permanent;
        # آدرس کانونیکال فروشگاه (طبق معماری سئو)
        rewrite ^/shop/(.+?)/?$ /shop/index.php?slug=$1 last;
    }

    location = /shop/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }


    # ========================================================
    # CLUBS
    # ========================================================
    #
    # IMPORTANT:
    # Without these exact/regex locations, /clubs/<slug> falls into
    # @extensionless and gets rewritten to /category/index.php (404),
    # because "clubs" is not a known system prefix there.

    location = /clubs {
        rewrite ^ /clubs/index.php last;
    }

    location = /clubs/ {
        rewrite ^ /clubs/index.php last;
    }

    location = /clubs/create {
        rewrite ^ /clubs/create.php last;
    }

    location = /clubs/mine {
        rewrite ^ /clubs/mine.php last;
    }
    location = /clubs/mine/ {
        rewrite ^ /clubs/mine.php last;
    }

    location ~ ^/clubs/([A-Za-z0-9\-]+)/?$ {
        rewrite ^ /clubs/view.php?slug=$1&$args last;
    }


    # ========================================================
    # WordPress Blog
    # ========================================================

    location /blog {
        try_files $uri $uri/ /blog/index.php?$args;
    }


    # ========================================================
    # Normal URLs
    # ========================================================

    location / {
        try_files $uri $uri/ @extensionless;
    }


    # ========================================================
    # Extensionless PHP URLs (with category routing first)
    # ========================================================

    location @extensionless {
        set $is_category_route 1;

        # Skip if path starts with a known system prefix/directory
        if ($uri ~* ^/(api|admin|includes|seed|database|storage|tools|vendor|logs|backups|sql|store|orders|store-offers|shops|search|shop|clubs|support|pwa|ai-lab|sep|iso|listing|listings|auth|page|src|css|js|assets|scripts|ops|blog)/) {
            set $is_category_route 0;
        }

        # Skip known top-level PHP pages (about, contact, ...) — handled by $uri.php below
        # Skip if file with .php extension actually exists
        if (-f $document_root$uri.php) {
            set $is_category_route 0;
        }

        # If still flagged as category → route to category handler
        if ($is_category_route = 1) {
            rewrite ^/(.+)$ /category/index.php?slug_path=$1 last;
        }

        # Otherwise fallback to extensionless PHP
        rewrite ^(.*)$ $1.php last;
    }


    # ========================================================
    # REST API v1 router  (/api/v1/...  ->  api/v1/index.php)
    # ========================================================

    location ~ ^/api/v1(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/index.php;
        fastcgi_param SCRIPT_NAME /api/v1/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }


    # ========================================================
    # PHP-FPM
    # ========================================================

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }


    # ========================================================
    # Hidden files
    # ========================================================

    location ~ /\. {
        deny all;
    }


    # ========================================================
    # Sensitive directories
    # ========================================================

    location ~* ^/(database|includes|storage)/ {
        deny all;
    }
}
