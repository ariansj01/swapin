# ============================================================
# HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name swaapin.ir www.swaapin.ir;

    return 301 https://swaapin.ir$request_uri;
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name swaapin.ir www.swaapin.ir;

    root /var/www/swapin;
    index index.php index.html;

    client_max_body_size 128M;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privateKey.pem;

    access_log /var/log/nginx/swaapin.access.log;
    error_log  /var/log/nginx/swaapin.error.log;




# SEO canonical redirects


location = /auth/login {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/auth/login.php;
    fastcgi_param SCRIPT_NAME /auth/login.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}





location = /sitemap-main.xml {
    return 301 https://swaapin.ir/sitemap.xml;
}



# Canonical PHP URLs - direct requests only
if ($request_uri ~ ^/auth/login\.php$) {
    return 301 /auth/login;
}

if ($request_uri ~ ^/trades\.php$) {
    return 301 /trades;
}

if ($request_uri ~ ^/wallet\.php$) {
    return 301 /wallet;
}

if ($request_uri ~ ^/profile/edit\.php$) {
    return 301 /profile/edit;
}

if ($request_uri ~ ^/listings/create\.php$) {
    return 301 /listings/create;
}

    # ========================================================
    # Canonical host
    # ========================================================

    if ($host = www.swaapin.ir) {
        return 301 https://swaapin.ir$request_uri;
    }


    # ========================================================
    # CMS Pages
    # ========================================================

    location /page/ {
        try_files $uri $uri/ @cms_page;
    }

    location @cms_page {
        rewrite ^/page/(.*)$ /page/index.php?slug=$1 last;
    }


    # ========================================================
    # Sensitive files
    # ========================================================

    location ~* \.(sql|zip|bak|backup|dump|env|log|ini|yml|yaml|md)$ {
        deny all;
    }

    location ~* ^/(run_.*\.php|migration_.*\.php|test.*\.php|env-test\.php)$ {
        deny all;
    }

    location ~* ^/(database|includes|storage|seed|tools|vendor|logs|backups|sql)/ {
        deny all;
    }


    # ========================================================
    # Special routes
    # ========================================================

    location = /trades {
        rewrite ^ /trades.php last;
    }

    location = /trades/ {
        rewrite ^ /trades.php last;
    }

    location = /profile {
        rewrite ^ /profile.php last;
    }

    location = /profile/ {
        rewrite ^ /profile.php last;
    }

    location = /sep/callback {
        try_files $uri /payment_callback.php$is_args$args;
    }


    # ========================================================
    # Category
    # ========================================================

    # 301 Redirect old /category/* URLs → new URLs without /category
    location ~ ^/category/(.+)$ {
        try_files $uri /category/index.php?redirect_slugs=$1;
    }

    location = /category/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # New hierarchical category URLs (without /category prefix)
    # Checked BEFORE @extensionless so categories win over PHP files.
    # Must exclude known system prefixes/dirs/files.
    location @category_route {
        rewrite ^/(.+)$ /category/index.php?slug_path=$1 last;
    }

    # Use a named location with conditional logic in @extensionless alternative:
    # We'll insert category check BEFORE the generic PHP rewrite. The approach:
    #  - Intercept @extensionless, detect non-system paths, proxy to category


    # ========================================================
    # SEO canonical PHP URLs
    # ========================================================

    if ($request_uri ~ ^/about\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/about;
    }

    if ($request_uri ~ ^/contact\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/contact;
    }

    if ($request_uri ~ ^/terms\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/terms;
    }

    if ($request_uri ~ ^/privacy\.php(?:\?.*)?$) {
        return 301 https://swaapin.ir/privacy;
    }


    # ========================================================
    # Listings canonical URLs
    # ========================================================

    location = /listings/all {
        return 301 https://swaapin.ir/listings/;
    }

    location = /listings/all.php {
        return 301 https://swaapin.ir/listings/;
    }


    # ========================================================
    # Store
    # ========================================================

    location = /store {
        rewrite ^ /store/index.php last;
    }

    location = /store/ {
        rewrite ^ /store/index.php last;
    }

    location = /store/request {
        rewrite ^ /store/request.php last;
    }

    location = /shops {
        rewrite ^ /shops/index.php last;
    }
    location = /shops/ {
        rewrite ^ /shops/index.php last;
    }
    location = /shops/online {
        rewrite ^ /shops/index.php?type=online last;
    }
    location = /shops/online/ {
        rewrite ^ /shops/index.php?type=online last;
    }
    location = /shops/physical {
        rewrite ^ /shops/index.php?type=physical last;
    }
    location = /shops/physical/ {
        rewrite ^ /shops/index.php?type=physical last;
    }


    # ========================================================
    # SHOP
    # ========================================================
    #
    # IMPORTANT:
    # /shop/index.php has an exact location below.
    # This is required because ^~ /shop/ otherwise prevents
    # the generic PHP location from handling shop PHP files.
    #

    location ^~ /shop/ {
        try_files $uri $uri/ @shop_page;
    }

    location @shop_page {
        rewrite ^/shop/(.+?)/?$ /shop/index.php?slug=$1 last;
    }

    location = /shop/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }


    # ========================================================
    # WordPress Blog
    # ========================================================

    location /blog {
        try_files $uri $uri/ /blog/index.php?$args;
    }


    # ========================================================
    # Normal URLs
    # ========================================================

    location / {
        try_files $uri $uri/ @extensionless;
    }


    # ========================================================
    # Extensionless PHP URLs (with category routing first)
    # ========================================================

    location @extensionless {
        set $is_category_route 1;

        # Skip if path starts with a known system prefix/directory
        if ($uri ~* ^/(api|admin|includes|seed|database|storage|tools|vendor|logs|backups|sql|store|orders|store-offers|shops|search|shop|support|pwa|ai-lab|sep|iso|listings|auth|page|src|css|js|assets|scripts|ops|blog)/) {
            set $is_category_route 0;
        }

        # Skip known top-level PHP pages (about, contact, ...) — handled by $uri.php below
        # Skip if file with .php extension actually exists
        if (-f $document_root$uri.php) {
            set $is_category_route 0;
        }

        # If still flagged as category → route to category handler
        if ($is_category_route = 1) {
            rewrite ^/(.+)$ /category/index.php?slug_path=$1 last;
        }

        # Otherwise fallback to extensionless PHP
        rewrite ^(.*)$ $1.php last;
    }


    # ========================================================
    # PHP-FPM
    # ========================================================

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }


    # ========================================================
    # Hidden files
    # ========================================================

    location ~ /\. {
        deny all;
    }


    # ========================================================
    # Sensitive directories
    # ========================================================

    location ~* ^/(database|includes|storage)/ {
        deny all;
    }
}