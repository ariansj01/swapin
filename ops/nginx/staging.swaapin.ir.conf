# ============================================================
# staging.swaapin.ir
# نسخهٔ استیج از ops/nginx/swaapin.ir.conf
# تفاوت‌ها: دامنه staging، ریشه swapin-staging و هدر noindex سراسری.
# قبل از ری‌لود، نسخه PHP-FPM را با ls /run/php/ چک کن.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name staging.swaapin.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.swaapin.ir;

    root /var/www/swapin-staging;
    index index.php index.html;

    client_max_body_size 128M;

    ssl_certificate     /etc/letsencrypt/live/staging.swaapin.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.swaapin.ir/privkey.pem;

    access_log /var/log/nginx/staging.swaapin.access.log;
    error_log  /var/log/nginx/staging.swaapin.error.log;

    # محیط استیج هرگز نباید ایندکس شود
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ========================================================
    # SEO canonical PHP URLs
    # ========================================================

    location = /sitemap-main.xml {
        return 301 https://$host/sitemap.xml;
    }

    if ($request_uri ~ ^/auth/login\.php$)     { return 301 /auth/login; }
    if ($request_uri ~ ^/trades\.php$)         { return 301 /trades; }
    if ($request_uri ~ ^/wallet\.php$)         { return 301 /wallet; }
    if ($request_uri ~ ^/profile/edit\.php$)   { return 301 /profile/edit; }
    if ($request_uri ~ ^/listings/create\.php$){ return 301 /listings/create; }

    if ($request_uri ~ ^/about\.php(?:\?.*)?$)   { return 301 /about; }
    if ($request_uri ~ ^/contact\.php(?:\?.*)?$) { return 301 /contact; }
    if ($request_uri ~ ^/terms\.php(?:\?.*)?$)   { return 301 /terms; }
    if ($request_uri ~ ^/privacy\.php(?:\?.*)?$) { return 301 /privacy; }

    # Legacy WordPress dated URLs -> postname URLs
    location ~ "^/blog/[0-9]{4}/[0-9]{2}/[0-9]{2}/(.+?)/?$" {
        return 301 https://$host/blog/$1/;
    }

    # ========================================================
    # CMS Pages
    # ========================================================

    location /page/ {
        try_files $uri $uri/ @cms_page;
    }

    location @cms_page {
        rewrite ^/page/(.*)$ /page/index.php?slug=$1 last;
    }

    # ========================================================
    # Sensitive files / test pages
    # ========================================================

    location ~* \.(sql|zip|bak|backup|dump|env|log|ini|yml|yaml|md)$ {
        deny all;
    }

    location ~* ^/(run_.*\.php|migration_.*\.php|test.*\.php|env-test\.php)$ {
        return 410;
    }

    location ~* ^/(database|includes|storage|seed|tools|vendor|logs|backups|sql)/ {
        deny all;
    }

    # ========================================================
    # Special routes
    # ========================================================

    location = /app        { rewrite ^ /download.php last; }
    location = /app/       { rewrite ^ /download.php last; }
    location = /download   { return 301 https://$host/app; }
    location = /download/  { return 301 https://$host/app; }

    location = /exchange    { return 301 https://$host/; }
    location = /exchange/   { return 301 https://$host/; }
    location = /exchange.php{ return 301 https://$host/; }

    location = /trades {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/trades.php;
        fastcgi_param SCRIPT_NAME /trades.php;
        fastcgi_param QUERY_STRING $args;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location = /trades/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/trades.php;
        fastcgi_param SCRIPT_NAME /trades.php;
        fastcgi_param QUERY_STRING $args;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /profile  { rewrite ^ /profile.php last; }
    location = /profile/ { rewrite ^ /profile.php last; }

    location = /sep/callback {
        try_files $uri /payment_callback.php$is_args$args;
    }

    # ========================================================
    # Category router
    # ========================================================

    # 301 آدرس‌های قدیمی /category/* → آدرس‌های سلسله‌مراتبی
    location ~ ^/category/(.+)$ {
        try_files $uri /category/index.php?redirect_slugs=$1;
    }

    location ~ "^/(?:\{APP_URL\}|%7BAPP_URL%7D)/category/(.+?)/?$" {
        rewrite ^ /category/index.php?redirect_slugs=$1 last;
    }

    location = /category/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ========================================================
    # Listings canonical URLs (مهاجرت — سند بخش ۱۱)
    # ========================================================

    location = /listings          { return 301 https://$host/iran?; }
    location = /listings/         { return 301 https://$host/iran?; }
    location = /listings.php      { return 301 https://$host/iran?; }
    location = /listings/all      { return 301 https://$host/iran?; }
    location = /listings/all.php  { return 301 https://$host/iran?; }

    location = /real-estate {
        if ($arg_city = karaj) { return 301 https://$host/karaj/real-estate?; }
        return 301 https://$host/iran/real-estate?;
    }
    location = /real-estate/ {
        if ($arg_city = karaj) { return 301 https://$host/karaj/real-estate?; }
        return 301 https://$host/iran/real-estate?;
    }

    location = /vehicles/cars/passenger-cars   { return 301 https://$host/iran/passenger-cars?; }
    location = /vehicles/cars/passenger-cars/  { return 301 https://$host/iran/passenger-cars?; }

    location = /electronics/mobile-tablet/mobile-phones  { return 301 https://$host/iran/mobile-phones?; }
    location = /electronics/mobile-tablet/mobile-phones/ { return 301 https://$host/iran/mobile-phones?; }

    # نقشه مستقل حذف شد → 410 Gone
    location = /listings/map          { return 410; }
    location = /listings/map/         { return 410; }
    location = /listings/map_view.php { return 410; }

    # ========================================================
    # Store / Shops / Shop
    # ========================================================

    location = /store         { rewrite ^ /store/index.php last; }
    location = /store/        { rewrite ^ /store/index.php last; }
    location = /store/request { rewrite ^ /store/request.php last; }

    location = /shops {
        if ($arg_type = online)   { return 301 /shops/online; }
        if ($arg_type = physical) { return 301 /shops/physical; }
        rewrite ^ /shops/index.php last;
    }
    location = /shops/ {
        if ($arg_type = online)   { return 301 /shops/online; }
        if ($arg_type = physical) { return 301 /shops/physical; }
        rewrite ^ /shops/index.php last;
    }
    location = /shops/online     { rewrite ^ /shops/index.php?type=online last; }
    location = /shops/online/    { rewrite ^ /shops/index.php?type=online last; }
    location = /shops/physical   { rewrite ^ /shops/index.php?type=physical last; }
    location = /shops/physical/  { rewrite ^ /shops/index.php?type=physical last; }

    location ^~ /shop/ {
        try_files $uri $uri/ @shop_page;
    }

    location @shop_page {
        rewrite ^/shop/(online|physical|both)/(.+?)/?$ /shop/$2 permanent;
        rewrite ^/shop/(.+?)/?$ /shop/index.php?slug=$1 last;
    }

    location = /shop/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ========================================================
    # Clubs
    # ========================================================

    location = /clubs {
        rewrite ^ /clubs/index.php last;
    }
    location ^~ /clubs/ {
        rewrite ^/clubs/create/?$ /clubs/create.php last;
        rewrite ^/clubs/mine/?$ /clubs/mine.php last;
        rewrite ^/clubs/([A-Za-z0-9\-]+)/?$ /clubs/view.php?slug=$1&$args last;
        rewrite ^/clubs/?$ /clubs/index.php last;
        try_files $uri $uri/ /clubs/index.php?$args;
    }

    # ========================================================
    # Blog
    # ========================================================

    location /blog {
        try_files $uri $uri/ /blog/index.php?$args;
    }

    # ========================================================
    # Normal URLs
    # ========================================================

    location / {
        try_files $uri $uri/ @extensionless;
    }

    # ========================================================
    # Extensionless PHP + category routing
    # ========================================================

    location @extensionless {
        set $is_category_route 1;

        if ($uri ~* ^/(api|admin|includes|seed|database|storage|tools|vendor|logs|backups|sql|store|orders|store-offers|shops|search|shop|clubs|support|pwa|ai-lab|sep|iso|listing|listings|auth|page|src|css|js|assets|scripts|ops|blog)/) {
            set $is_category_route 0;
        }

        if (-f $document_root$uri.php) {
            set $is_category_route 0;
        }

        if ($is_category_route = 1) {
            rewrite ^/(.+)$ /category/index.php?slug_path=$1 last;
        }

        rewrite ^(.*)$ $1.php last;
    }

    # ========================================================
    # REST API v1
    # ========================================================

    location ~ ^/api/v1(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/index.php;
        fastcgi_param SCRIPT_NAME /api/v1/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ========================================================
    # PHP-FPM
    # ========================================================

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ========================================================
    # Hidden files
    # ========================================================

    location ~ /\. {
        deny all;
    }
}
