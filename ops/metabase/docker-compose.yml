name: swaapin-metabase

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: metabaseappdb
      POSTGRES_USER: metabase_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    volumes:
      - metabase_pg_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    mem_limit: 768m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_app -d metabaseappdb"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  metabase:
    image: metabase/metabase:v0.64.3
    restart: unless-stopped
    init: true
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase_app
      MB_DB_PASS_FILE: /run/secrets/postgres_password
      MB_DB_HOST: 127.0.0.1
      MB_JETTY_HOST: 127.0.0.1
      MB_JETTY_PORT: "3000"
      MB_SITE_URL: https://swaapin.ir/meta/base/
      MB_SITE_NAME: Swaapin Analytics
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?Set in root-only .env}
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:?Set in root-only .env}
      MB_DISABLE_LEGACY_STARTUP_ENCRYPTION: "true"
      JAVA_OPTS: -Xms512m -Xmx2g
      JAVA_TIMEZONE: Asia/Tehran
      MB_REPORT_TIMEZONE: Asia/Tehran
      MB_COLORIZE_LOGS: "false"
    secrets:
      - postgres_password
    mem_limit: 3g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  metabase_pg_data:
